[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-graph"
version = "0.1.0"
description = "A local, LLM-free knowledge graph for Markdown and Obsidian vaults, built for AI agents."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Diego Castro"}]
keywords = ["obsidian", "markdown", "knowledge-graph", "ai-agents", "claude-code", "llm", "tokens"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/DiegoCastro95/vault-graph"
Issues = "https://github.com/DiegoCastro95/vault-graph/issues"

[project.scripts]
vault-graph = "vault_graph:main"

[tool.setuptools]
py-modules = ["vault_graph"]
